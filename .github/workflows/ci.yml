name: MOSAIC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Backend Docker Image
      run: |
        cd backend
        docker build -t mosaic-backend .
        
    - name: Run Core Tests (Determinism, Staleness, E2E)
      run: |
        # Run exactly the core requested tests to gate the build
        docker run mosaic-backend pytest tests/test_determinism.py tests/test_lifecycle.py tests/test_api_e2e.py
        
    - name: Run Full Test Suite & Coverage
      run: |
        docker run mosaic-backend sh -c "pip install pytest-cov && pytest --cov=app.recovery --cov=app.state"
